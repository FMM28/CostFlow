services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}

    image: costflow:latest

    container_name: costflow-app

    restart: unless-stopped

    init: true

    ipc: host

    env_file:
      - .env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    expose:
      - "8000"

    volumes:
      - ./logs:/app/logs

      - ./app/static/css:/app/app/static/css:ro
      - ./app/static/fonts:/app/app/static/fonts:ro
      - ./app/static/icons:/app/app/static/icons:ro
      - ./app/static/img:/app/app/static/img:ro
      - ./app/static/js:/app/app/static/js:ro
      - ./app/static/uploads:/app/app/static/uploads

    command: >
      gunicorn
      -c docker/gunicorn.conf.py
      "app:create_app()"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - costflow

  nginx:
    image: nginx:1.30-alpine

    container_name: costflow-nginx

    restart: unless-stopped

    depends_on:
      app:
        condition: service_healthy

    ports:
      - "80:80"

    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

      - ./app/static/css:/app/app/static/css:ro
      - ./app/static/fonts:/app/app/static/fonts:ro
      - ./app/static/icons:/app/app/static/icons:ro
      - ./app/static/img:/app/app/static/img:ro
      - ./app/static/js:/app/app/static/js:ro
      - ./app/static/uploads:/app/app/static/uploads

      - ./logs/nginx:/var/log/nginx

    networks:
      - costflow

  cloudflared:
    image: cloudflare/cloudflared:latest

    container_name: costflow-cloudflared

    restart: unless-stopped

    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

    depends_on:
      nginx:
        condition: service_started

    networks:
      - costflow

  cloudflared-ssh:
    image: cloudflare/cloudflared:latest

    container_name: costflow-cloudflared-ssh

    restart: unless-stopped

    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_SSH_TUNNEL_TOKEN}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - costflow

networks:
  costflow:
    driver: bridge