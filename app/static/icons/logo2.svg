<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Fondo circular sólido -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)"/>

  <!-- Barras de precios más gruesas y separadas -->
  <rect x="8" y="14" width="3.5" height="9" rx="1.5" fill="#ffffff" opacity="0.95"/>
  <rect x="14" y="9" width="4" height="14" rx="1.5" fill="#ffffff" opacity="0.95"/>
  <rect x="20.5" y="12" width="3.5" height="11" rx="1.5" fill="#ffffff" opacity="0.95"/>

  <!-- Línea de flujo gruesa -->
  <path d="M5 22 C5 16, 27 16, 27 10" stroke="url(#flow)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Nodo de rastreo más grande y sin halo -->
  <circle cx="27" cy="10" r="3" fill="#f59e0b"/>
</svg>