<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo base (forma estándar para íconos de app) -->
  <rect x="40" y="40" width="432" height="432" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Barras de comparación de precios -->
  <rect x="156" y="260" width="42" height="100" rx="12" fill="#ffffff" opacity="0.88"/>
  <rect x="235" y="190" width="42" height="170" rx="12" fill="#ffffff" opacity="0.88"/>
  <rect x="314" y="240" width="42" height="120" rx="12" fill="#ffffff" opacity="0.88"/>
  
  <!-- Flujo de proceso y seguimiento -->
  <path d="M100 390 C 100 290, 412 290, 412 140" stroke="url(#flowGrad)" stroke-width="18" fill="none" stroke-linecap="round"/>
  
  <!-- Nodo activo de rastreo de orden -->
  <circle cx="412" cy="140" r="16" fill="#f59e0b"/>
  <circle cx="412" cy="140" r="26" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.45"/>
</svg>