{% extends "admin/base.html" %}

{% block title %}
Vista previa de cotización
{% endblock %}

{% block content %}

<div class="flex flex-col h-full gap-4">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">

        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-100 rounded-lg flex items-center justify-center">
                <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-semibold text-gray-800">
                    Vista previa de cotización
                </h1>
                <p class="text-sm text-gray-500">
                    Orden: <span class="font-mono font-medium text-gray-700">{{ orden.clave_orden }}</span>
                </p>
            </div>
        </div>

        <div class="flex flex-wrap gap-2">
            <!-- Botón Regresar - Gris/Neutro -->
            <a href="{{ url_for('admin.orden_detalle', id_orden=orden.id_orden) }}"
                class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 hover:border-gray-400 transition-colors shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Regresar
            </a>

            <!-- Botón Abrir en otra pestaña - Púrpura/Violeta -->
            <a href="{{ pdf_url }}" target="_blank"
                class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-purple-700 bg-purple-50 border border-purple-200 rounded-lg hover:bg-purple-100 hover:border-purple-300 transition-colors shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
                Abrir en otra pestaña
            </a>

            <!-- Botón Descargar PDF - Verde (acción principal) -->
            <a href="{{ pdf_url }}" download="{{ orden.clave_orden }}.pdf"
                class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-emerald-600 border border-emerald-600 rounded-lg hover:bg-emerald-700 transition-colors shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                Descargar PDF
            </a>
        </div>
    </div>

    <!-- PDF Viewer -->
    <div class="flex-1 border border-gray-200 rounded-lg overflow-hidden bg-gray-50 relative min-h-[600px] shadow-sm">
        <!-- Loader -->
        <div id="pdf-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-white z-10">
            <svg class="animate-spin w-10 h-10 text-emerald-600 mb-3" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            <p class="text-sm text-gray-600 font-medium">Cargando cotización...</p>
        </div>

        <iframe src="{{ pdf_url }}" class="w-full h-full"
            onload="document.getElementById('pdf-loader').style.display='none'"
            title="Vista previa de cotización {{ orden.clave_orden }}">
        </iframe>
    </div>

</div>

{% endblock %}
