<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">

<div class="min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md">
        
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 px-8 py-10 min-h-[520px] flex flex-col justify-between">

            <div>
                <div class="flex justify-center mb-6">
                    <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" 
                             class="w-10 h-10 text-gray-500" 
                             fill="none" 
                             viewBox="0 0 24 24" 
                             stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" 
                                  d="M15.75 9V5.25A3.75 3.75 0 0012 1.5a3.75 3.75 0 00-3.75 3.75V9m-1.5 0h10.5A1.5 1.5 0 0118.75 10.5v9A1.5 1.5 0 0117.25 21h-10.5A1.5 1.5 0 015.25 19.5v-9A1.5 1.5 0 016.75 9z"/>
                        </svg>
                    </div>
                </div>

                <div class="text-center mb-8">
                    <h1 class="text-3xl font-semibold tracking-tight">Iniciar sesión</h1>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        <div class="mb-4 space-y-2">
                            {% for category, message in messages %}
                                <div class="text-base px-4 py-3 rounded-md
                                    {% if category == 'danger' %}
                                        bg-red-50 text-red-600 border border-red-100
                                    {% elif category == 'info' %}
                                        bg-blue-50 text-blue-600 border border-blue-100
                                    {% else %}
                                        bg-gray-100 text-gray-600
                                    {% endif %}
                                ">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-7">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div>
                        <input 
                            type="text" 
                            name="username"
                            placeholder="Usuario"
                            required
                            autofocus
                            class="w-full px-3 py-3 bg-transparent border-0 border-b border-gray-300 
                                   focus:border-gray-900 focus:ring-0 text-base placeholder-gray-400"
                        >
                    </div>

                    <div>
                        <input 
                            type="password" 
                            name="password"
                            placeholder="Contraseña"
                            required
                            class="w-full px-3 py-3 bg-transparent border-0 border-b border-gray-300 
                                   focus:border-gray-900 focus:ring-0 text-base placeholder-gray-400"
                        >
                    </div>

                    <button 
                        type="submit"
                        class="w-full bg-gray-900 text-white py-3 rounded-md text-base font-medium
                               hover:bg-gray-800 transition"
                    >
                        Entrar
                    </button>

                </form>
            </div>

        </div>

    </div>

</div>

</body>
</html>
